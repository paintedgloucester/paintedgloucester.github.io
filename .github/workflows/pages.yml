name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      since:
        description: 'Send IndexNow every page changed since this commit (optional)'
        required: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the site's scripts parse
        run: for f in js/*.js; do node --check "$f" || exit 1; done
      - name: Build the plain pages, sitemap and offline worker
        run: node tools/build.mjs && node --check sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Tell IndexNow search engines (Bing and others) which pages changed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ inputs.since }}
        # Compare with the last deploy that succeeded, not just the previous push, so pages
        # from a deploy that failed (GitHub sometimes returns a server error) are still sent.
        run: |
          base="$SINCE"
          if [ -z "$base" ]; then
            base=$(gh api "repos/${{ github.repository }}/actions/workflows/pages.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha' 2>/dev/null || true)
          fi
          [ -z "$base" ] && base="${{ github.event.before }}"
          echo "IndexNow: comparing $base..${{ github.sha }}"
          node tools/indexnow.mjs "$base" "${{ github.sha }}"
